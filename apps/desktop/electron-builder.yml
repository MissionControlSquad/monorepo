appId: cloud.agentcenter.desktop
productName: AgentCenter
copyright: Copyright © 2026 AgentCenter

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - "!node_modules"
  - "!src"
  - "!electron"
  - "!.next"

icon: build/icon

# Copy icon files into the packaged app's resources directory so main.ts
# can load them at runtime via process.resourcesPath
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon.icns
    to: icon.icns

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Set notarize: true and provide APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID env vars to enable notarization
  notarize: false

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  category: Development

protocols:
  - name: AgentCenter
    schemes:
      - agentcenter

publish:
  provider: github
  owner: MissionControlSquad
  repo: monorepo
