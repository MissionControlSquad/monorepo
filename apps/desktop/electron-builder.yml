appId: cloud.agentcenter.desktop
productName: AgentCenter
copyright: Copyright © 2026 AgentCenter

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - "!node_modules"
  - "!src"
  - "!electron"
  - "!.next"

# Place icon files at:
#   build/icon.icns  (512x512, macOS)
#   build/icon.ico   (256x256, Windows)
#   build/icon.png   (1024x1024, Linux)
icon: build/icon

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize:
    teamId: ${APPLE_TEAM_ID}

dmg:
  sign: true
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  certificateSubjectName: ${WIN_CERT_SUBJECT_NAME}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  category: Development

protocols:
  - name: AgentCenter
    schemes:
      - agentcenter

publish:
  provider: github
  owner: ${GH_OWNER}
  repo: ${GH_REPO}
