name: Publish Public Docker Image

# Trigger manually or on release publication
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.0.41)"
        required: true
        type: string
      latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: true
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          echo "name=${OWNER,,}/agentcenter" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Determine version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag_latest=${{ inputs.latest }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.release.tag_name }}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"
          if [ "${{ steps.meta.outputs.tag_latest }}" = "true" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build test image (local platform only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: agentcenter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          # Start container without the entrypoint (skip DB migration)
          docker run -d --name smoke-test \
            -p 3000:3000 \
            -e DATABASE_URL="postgresql://fake:fake@localhost:5432/fake" \
            -e HOSTNAME=0.0.0.0 \
            --entrypoint node \
            agentcenter:test \
            apps/web/server.js

          # Wait for the server to respond (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Health check failed after 30 attempts"
              docker logs smoke-test
              exit 1
            fi
            sleep 1
          done

          docker stop smoke-test
          docker rm smoke-test

      - name: Build and push (multi-platform)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.release.created_at || github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
