name: Publish Self-Hosted Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.0.42)"
        required: true
        type: string
      latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agentcenter

# Least privilege: every job declares the permissions it needs.
permissions: {}

jobs:
  # ── Job 1: Build and smoke test (single platform, fast) ──────────
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Fail fast on a malformed version before anything is built or pushed.
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like 1.2.3 (got: $VERSION)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: agentcenter:test
          cache-from: type=gha,scope=self-hosted
          cache-to: type=gha,scope=self-hosted,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name smoke-test \
            -p 3000:3000 \
            -e POSTGRES_PRISMA_URL="postgresql://fake:fake@localhost:5432/fake" \
            -e POSTGRES_URL_NON_POOLING="postgresql://fake:fake@localhost:5432/fake" \
            -e AUTH_SECRET="ci-smoke-test-secret" \
            -e CRON_SECRET="ci-smoke-test-cron" \
            -e HOSTNAME=0.0.0.0 \
            --entrypoint node \
            agentcenter:test \
            apps/web/server.js

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Health check failed after 30 attempts"
              docker logs smoke-test
              exit 1
            fi
            sleep 1
          done

          docker stop smoke-test
          docker rm smoke-test

  # ── Job 2: Build and push each platform in parallel ──────────────
  push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        run: |
          echo "name=${OWNER,,}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Prepare platform pair
        id: platform
        run: |
          PAIR=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "pair=$PAIR" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=self-hosted-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,scope=self-hosted-${{ steps.platform.outputs.pair }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-self-hosted-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Job 3: Create multi-platform manifest and tag ────────────────
  merge-and-tag:
    needs: push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set image name
        id: image
        run: |
          echo "name=${OWNER,,}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-self-hosted-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest and push tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          # Reject anything that isn't a plain version so the input can't smuggle in extra tags or flags.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like 1.2.3 (got: $VERSION)"
            exit 1
          fi

          TAGS="-t $IMAGE:$VERSION"
          if [ "$LATEST" = "true" ]; then
            TAGS="$TAGS -t $IMAGE:latest"
          fi

          docker buildx imagetools create \
            $TAGS \
            $(printf "$IMAGE@sha256:%s " $(ls /tmp/digests/))
