name: Build & Publish Electron Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact_name: AgentCenter-macOS
            artifact_glob: apps/desktop/release/*.dmg
          - os: windows-latest
            platform: win
            artifact_name: AgentCenter-Windows
            artifact_glob: apps/desktop/release/*.exe
          - os: ubuntu-latest
            platform: linux
            artifact_name: AgentCenter-Linux
            artifact_glob: apps/desktop/release/*.AppImage

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Required by electron-builder on Linux for AppImage packaging
      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y fakeroot dpkg

      # Sync package.json version from the git tag (desktop-v1.2.3 → 1.2.3).
      # This ensures the built app reports the correct version for auto-update comparisons.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: apps/desktop
        shell: bash
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          APP_VERSION="${TAG_VERSION#desktop-v}"
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version

      - name: Bundle Electron main process (production)
        working-directory: apps/desktop
        run: node scripts/build.mjs --prod

      # ── macOS: build + optionally sign & notarize ───────────────────
      - name: Build macOS DMG
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PUBLISH_FLAG="always"
          else
            PUBLISH_FLAG="never"
          fi
          npx electron-builder --mac --publish "$PUBLISH_FLAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ── Windows: build + optionally sign ───────────────────────────
      - name: Build Windows NSIS installer
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PUBLISH_FLAG="always"
          else
            PUBLISH_FLAG="never"
          fi
          npx electron-builder --win --publish "$PUBLISH_FLAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CERT_SUBJECT_NAME: ${{ secrets.WIN_CERT_SUBJECT_NAME }}

      # ── Linux ───────────────────────────────────────────────────────
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PUBLISH_FLAG="always"
          else
            PUBLISH_FLAG="never"
          fi
          npx electron-builder --linux --publish "$PUBLISH_FLAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 30
          if-no-files-found: error
