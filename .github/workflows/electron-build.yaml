name: Build Electron Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile Electron TypeScript
        run: cd apps/desktop && npx tsc -p tsconfig.json

      - name: Build macOS DMG
        run: cd apps/desktop && npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: AgentCenter-macOS
          path: apps/desktop/release/*.dmg
