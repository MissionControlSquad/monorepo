name: Build & Publish Electron Desktop App

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  HOW TO RELEASE                                                         │
# │                                                                         │
# │  All platforms:                                                         │
# │    git tag desktop-v1.2.3 && git push origin desktop-v1.2.3            │
# │                                                                         │
# │  Single platform (GitHub UI → Actions → Run workflow):                 │
# │    Select platform: mac | win | linux | all                             │
# │    Toggle "Publish to Releases" if needed                               │
# │                                                                         │
# │  SIGNING SECRETS (repo Settings → Secrets → Actions)                   │
# │  All optional — omitting them produces unsigned builds that still work. │
# │                                                                         │
# │  macOS:  CSC_LINK, CSC_KEY_PASSWORD                                     │
# │          APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID          │
# │  Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD                            │
# │                                                                         │
# │  Without signing secrets:                                               │
# │    macOS   → unsigned DMG  (users: xattr -cr AgentCenter.app)          │
# │    Windows → unsigned EXE  (SmartScreen warning, installs fine)        │
# │    Linux   → no signing needed, always clean                           │
# └─────────────────────────────────────────────────────────────────────────┘

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: false
        default: "all"
        type: choice
        options: [all, mac, win, linux]
      publish:
        description: "Publish to GitHub Releases?"
        required: false
        default: false
        type: boolean

  push:
    tags:
      - "desktop-v*"

# ── Shared expression helpers ────────────────────────────────────────────────
# IS_TAG_PUSH   → true when triggered by a desktop-v* tag
# SHOULD_PUBLISH → true on tag push OR when manually asked to publish
env:
  IS_TAG_PUSH: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
  SHOULD_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish == true }}

jobs:
  # ── 1. TypeScript typecheck ──────────────────────────────────────────────
  # Fail fast before spinning up expensive macOS / Windows runners.
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck

  # ── 2. Create draft GitHub Release ──────────────────────────────────────
  # Runs only on tag push. Pre-creates the release as a DRAFT so all three
  # platform builds can upload to it without racing to create it.
  create-release:
    name: Create GitHub Release draft
    runs-on: ubuntu-latest
    needs: typecheck
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          name: "AgentCenter ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Build matrix ──────────────────────────────────────────────────────
  # Each platform only runs when selected:
  #   tag push          → all 3 platforms always run
  #   workflow_dispatch → only the selected platform runs (or all if "all")
  build:
    name: Build ${{ matrix.artifact_name }}
    needs: [typecheck, create-release]
    # matrix context is NOT available in job-level if: — GitHub evaluates job
    # conditions before matrix expansion. Platform filtering is handled inside
    # the job: each build step already has  if: matrix.platform == 'xxx'  so
    # non-selected platforms skip their build step and exit cleanly.
    if: |
      always() &&
      needs.typecheck.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon; cross-compiles x86_64 for universal DMG
            platform: mac
            artifact_name: AgentCenter-macOS
            # DMG + update manifest (latest-mac.yml) for electron-updater
            artifact_glob: |
              apps/desktop/release/*.dmg
              apps/desktop/release/latest-mac.yml

          - os: windows-latest
            platform: win
            artifact_name: AgentCenter-Windows
            # EXE + update manifest (latest.yml) for electron-updater
            artifact_glob: |
              apps/desktop/release/*.exe
              apps/desktop/release/latest.yml

          - os: ubuntu-latest
            platform: linux
            artifact_name: AgentCenter-Linux
            # AppImage + update manifest (latest-linux.yml) for electron-updater
            artifact_glob: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/latest-linux.yml

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      # Gate: on workflow_dispatch, skip this matrix entry if it wasn't selected.
      # (matrix context is unavailable in job-level if:, so we gate here instead.)
      - name: Check platform selection
        id: gate
        shell: bash
        run: |
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/desktop-v') }}"
          SEL="${{ inputs.platform || 'all' }}"
          THIS="${{ matrix.platform }}"
          if [[ "$IS_TAG" == "true" || "$SEL" == "all" || "$SEL" == "$THIS" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping $THIS build (selected platform: $SEL)"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Install Linux packaging tools
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'linux'
        run: sudo apt-get install -y fakeroot dpkg

      # Sync package.json version from the git tag (desktop-v1.2.3 → 1.2.3)
      # so the shipped app reports the correct version for auto-update checks.
      - name: Sync version from tag
        if: steps.gate.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: apps/desktop
        shell: bash
        run: |
          APP_VERSION="${{ github.ref_name }}"
          APP_VERSION="${APP_VERSION#desktop-v}"
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version

      # Bundle main.ts + preload.ts with esbuild.
      # All npm dependencies are inlined — no node_modules lookup at package time.
      # RELEASES_BASE_URL is baked into the binary so electron-updater checks the
      # public S3/CDN endpoint rather than the (possibly private) GitHub repo.
      - name: Bundle Electron (production)
        if: steps.gate.outputs.run == 'true'
        working-directory: apps/desktop
        run: node scripts/build.mjs --prod
        env:
          RELEASES_BASE_URL: ${{ vars.RELEASES_BASE_URL }}

      # ── macOS ─────────────────────────────────────────────────────────────
      # Signing is optional. When CSC_LINK secret is absent GitHub passes it
      # as an empty string. electron-builder treats CSC_LINK="" as a file path,
      # resolves it to the working directory, and fails with "not a file".
      # Fix: write signing vars to GITHUB_ENV only when the secret is non-empty
      # so electron-builder never sees an empty CSC_LINK.
      - name: Configure macOS signing
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'mac'
        shell: bash
        run: |
          if [[ -n "$CSC_LINK_SECRET" ]]; then
            printf 'CSC_LINK=%s\n'          "$CSC_LINK_SECRET"          >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n'  "$CSC_KEY_PASSWORD_SECRET"  >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true"                      >> "$GITHUB_ENV"
            echo "Signing: enabled"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false"                     >> "$GITHUB_ENV"
            echo "Signing: disabled (CSC_LINK secret not set — unsigned DMG)"
          fi
        env:
          CSC_LINK_SECRET:         ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build macOS DMG
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'mac'
        working-directory: apps/desktop
        shell: bash
        run: |
          PUBLISH_FLAG=$( [[ "$SHOULD_PUBLISH" == "true" ]] && echo "always" || echo "never" )
          npm exec -- electron-builder --mac --publish "$PUBLISH_FLAG"
        env:
          GH_TOKEN:                    ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          # CSC_LINK, CSC_KEY_PASSWORD, CSC_IDENTITY_AUTO_DISCOVERY are set
          # by the "Configure macOS signing" step above via GITHUB_ENV.

      # ── Windows ───────────────────────────────────────────────────────────
      # Signing:
      #   WIN_CSC_LINK set     → EV/OV signed; no SmartScreen warning
      #   WIN_CSC_LINK absent  → electron-builder skips signing automatically;
      #                          SmartScreen shows "Unknown publisher" on first run
      - name: Build Windows installer
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'win'
        working-directory: apps/desktop
        shell: bash
        run: |
          PUBLISH_FLAG=$( [[ "$SHOULD_PUBLISH" == "true" ]] && echo "always" || echo "never" )
          npm exec -- electron-builder --win --publish "$PUBLISH_FLAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # ── Linux ─────────────────────────────────────────────────────────────
      # No signing required. Always builds cleanly.
      - name: Build Linux AppImage
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          PUBLISH_FLAG=$( [[ "$SHOULD_PUBLISH" == "true" ]] && echo "always" || echo "never" )
          npm exec -- electron-builder --linux --publish "$PUBLISH_FLAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 30
          # warn instead of error because latest-*.yml is only present when
          # --publish always was used (tag push / manual publish toggle)
          if-no-files-found: warn

      # ── Mirror to public S3 ───────────────────────────────────────────
      # Uploads installers + electron-updater manifests (latest-*.yml) to a
      # public S3 bucket so downloads and auto-updates work from private repos.
      #
      # Required repo secrets / vars:
      #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  — IAM key with s3:PutObject
      #   AWS_REGION                                 — e.g. us-east-1  (variable)
      #   S3_RELEASES_BUCKET                         — e.g. agentcenter-releases
      #   S3_RELEASES_PREFIX                         — e.g. desktop  (variable, no leading /)
      #
      # Skipped automatically when secrets are absent (non-S3 setups).
      # NOTE: secrets context is not allowed in step if: — gate via env var instead.
      - name: Mirror to public S3
        if: steps.gate.outputs.run == 'true' && env.SHOULD_PUBLISH == 'true' && env.S3_BUCKET != ''
        shell: bash
        run: |
          aws s3 sync apps/desktop/release/ \
            "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --exclude "*" \
            --include "*.dmg"      \
            --include "*.exe"      \
            --include "*.AppImage" \
            --include "latest-mac.yml"   \
            --include "latest.yml"       \
            --include "latest-linux.yml" \
            --acl public-read \
            --cache-control "no-cache, no-store, must-revalidate"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ secrets.S3_RELEASES_BUCKET }}
          S3_PREFIX: ${{ vars.S3_RELEASES_PREFIX || 'desktop' }}

  # ── 4. Publish release ────────────────────────────────────────────────────
  # Flips the draft release to published only when ALL selected builds succeed.
  # If any build failed the draft stays hidden — nothing broken ships.
  # Only runs on tag push (workflow_dispatch has its own publish toggle above).
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [create-release, build]
    if: |
      startsWith(github.ref, 'refs/tags/desktop-v') &&
      needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Publish draft → live
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
