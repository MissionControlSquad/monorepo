name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: environment

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/app/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Pull Vercel Environment Information
        run: cd apps/web && npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Generate Prisma Client
        run: cd apps/web && npx prisma generate

      - name: Build Project
        run: cd apps/web && npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Run Database Migrations
        run: cd apps/web && set -a && source .vercel/.env.production.local && npx prisma migrate deploy

      - name: Deploy Prebuilt Artifacts to Vercel
        run: cd apps/web && npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
